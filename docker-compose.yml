services:
  localness:
    # Hub image published by the v* tag workflow. Pin a version:
    #   LOCALNESS_IMAGE=hwacc/localness:1.2.0 docker compose up -d
    # Compose interpolates this from the shell or a project `.env`, not from
    # env_file. To build locally instead, see docker-compose.build.yml.
    image: ${LOCALNESS_IMAGE:-hwacc/localness:latest}
    container_name: localness
    restart: unless-stopped
    ports:
      - '${LOCALNESS_PORT:-13000}:3000'
    env_file:
      - .env.docker
    volumes:
      # SQLite database and local uploads. Losing this volume loses the data.
      - localness-runtime:/app/runtime
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      # Migrations run before the server starts, so the first probe waits.
      start_period: 40s
      retries: 3

volumes:
  localness-runtime:
