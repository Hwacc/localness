# Publish @localness/contract to npm when a contract-v* tag is pushed.
# Tag format: contract-vMAJOR.MINOR.PATCH (optional -rc.N / -beta.N).
# After a stable publish, the version is committed back to the default branch.
# Independent of the Docker release: its `v*.*.*` filter does not match this
# prefix, so neither workflow fires for the other's tags.
# Auth is npm Trusted Publishing (OIDC): no token in repo secrets. The package
# must already exist on npm with this workflow registered as its trusted
# publisher, so the very first version is published by hand.
name: Release contract

on:
  push:
    tags:
      - 'contract-v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      DATABASE_URL: file:./runtime/db/ci.db
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted Publishing needs npm >= 11.5.1; the one bundled with Node 22 is older.
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm typecheck:full
      - run: pnpm test

      - name: Set version from tag
        working-directory: packages/contract
        run: sh "${GITHUB_WORKSPACE}/.github/scripts/set-package-version.sh" "${GITHUB_REF_NAME#contract-v}"

      - name: Refuse a version that is already published
        working-directory: packages/contract
        run: |
          name=$(node -p 'require("./package.json").name')
          version=$(node -p 'require("./package.json").version')
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "${name}@${version} is already on npm" >&2
            exit 1
          fi

      - run: pnpm --filter @localness/contract build

      - name: Publish
        working-directory: packages/contract
        run: npm publish --access public --provenance

  # The tag is the version source, and the publish job only rewrites
  # package.json inside its own runner, so without this the checked-in number
  # stays behind. Same follow-up commit the Docker release makes; pre-releases
  # skip it so an rc cut from a dev branch never touches the default branch. The
  # tag always contains "-" (`contract-v…`), so test for the pre-release suffixes.
  version:
    needs: publish
    if: ${{ !contains(github.ref_name, '-rc.') && !contains(github.ref_name, '-beta.') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set package.json from tag
        working-directory: packages/contract
        run: sh "${GITHUB_WORKSPACE}/.github/scripts/set-package-version.sh" "${GITHUB_REF_NAME#contract-v}"

      - name: Commit version on default branch
        run: |
          git add packages/contract/package.json
          if git diff --staged --quiet; then
            echo "packages/contract/package.json already at ${GITHUB_REF_NAME#contract-v}"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore(contract): set package.json version to ${GITHUB_REF_NAME#contract-v}"
          git push
