# Publish a public Docker Hub image when a semver tag is pushed.
# Tag format: vMAJOR.MINOR.PATCH (optional -rc.N / -beta.N).
# Image tags drop the leading v: v1.2.0 → huacc/localness:1.2.0
# Pre-release tags do not move :latest.
# Changelog: GitHub Release for every tag; Hub Overview gets the latest
# stable notes (Hub has no per-tag changelog UI).
name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  IMAGE: huacc/localness
  NUXT_SALT_SIZE: '10'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: file:./runtime/db/ci.db
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm typecheck
      - run: pnpm test

  changelog:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate notes
        run: sh .github/scripts/release-notes.sh > notes.md

      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}

  # Hub Overview PATCH needs a Hub PAT with Read/Write/Delete. A push-only
  # token (enough for docker/login-action) returns 403. Own job so a 403 does
  # not mark the GitHub Release as failed. v5 is Node 24; v4 trips the Node 20
  # deprecation on current runners.
  hub-overview:
    needs: changelog
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate notes
        run: sh .github/scripts/release-notes.sh > notes.md

      - name: Hub overview markdown
        run: |
          {
            echo "# ${IMAGE}"
            echo
            echo "Screenshot tagging + i18n key store. Not a headless CMS."
            echo
            echo "Each version's changelog: https://github.com/${GITHUB_REPOSITORY}/releases"
            echo
            cat notes.md
            echo
            echo "---"
            echo
            cat docker/README.md
          } > hub.md

      - uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE }}
          short-description: Screenshot tagging + i18n key store
          readme-filepath: hub.md

  # Tag is the version source. Do not bump package.json by hand before tagging.
  # The tagged commit may still show the previous number; this follow-up commit
  # on the default branch is what the next checkout sees.
  version:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set package.json from tag
        run: sh .github/scripts/set-package-version.sh "${GITHUB_REF_NAME}"

      - name: Commit version on default branch
        run: |
          git add package.json
          if git diff --staged --quiet; then
            echo "package.json already at ${GITHUB_REF_NAME#v}"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore: set package.json version to ${GITHUB_REF_NAME#v}"
          git push

  image:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v5

      - name: Set package.json from tag
        run: sh .github/scripts/set-package-version.sh "${GITHUB_REF_NAME}"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.description=Screenshot tagging + i18n key store. Changelog: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NUXT_SALT_SIZE=${{ env.NUXT_SALT_SIZE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
