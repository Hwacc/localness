# Publish a public Docker Hub image when a semver tag is pushed.
# Tag format: vMAJOR.MINOR.PATCH (optional -rc.N / -beta.N).
# Image tags drop the leading v: v1.2.0 → huacc/localness:1.2.0
# Pre-release tags do not move :latest.
# Changelog: GitHub Release for every tag; Hub Overview gets the latest
# stable notes (Hub has no per-tag changelog UI).
name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  IMAGE: huacc/localness
  NUXT_SALT_SIZE: '10'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: file:./runtime/db/ci.db
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm typecheck
      - run: pnpm test

  changelog:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate notes
        run: sh .github/scripts/release-notes.sh > notes.md

      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}

      # Hub Tags has no notes column. The Overview is the only markdown
      # surface; keep it on stable tags so an rc does not overwrite it.
      - name: Hub overview
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          {
            echo "# ${IMAGE}"
            echo
            echo "Screenshot tagging + i18n key store. Not a headless CMS."
            echo
            echo "Each version's changelog: https://github.com/${GITHUB_REPOSITORY}/releases"
            echo
            cat notes.md
            echo
            echo "---"
            echo
            cat docker/README.md
          } > hub.md

      - uses: peter-evans/dockerhub-description@v4
        if: ${{ !contains(github.ref_name, '-') }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE }}
          short-description: Screenshot tagging + i18n key store
          readme-filepath: hub.md

  image:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.description=Screenshot tagging + i18n key store. Changelog: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NUXT_SALT_SIZE=${{ env.NUXT_SALT_SIZE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
